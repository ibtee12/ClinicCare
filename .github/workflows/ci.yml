name: ClinicCare CI/CD Pipeline

on:
  push:
    branches: [ main, "feature/**", "fix/**", "ci/**", "docs/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8 (PEP8 compliance)
        run: |
          flake8 app/ tests/ seed.py --count --statistics

      - name: Run unit test suite with coverage
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml tests/unit/

      - name: Install Google Chrome & verify chromedriver
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl unzip
          google-chrome --version

      - name: Run Headless Chrome Selenium E2E Tests
        run: |
          pytest tests/e2e/test_selenium_flow.py

      - name: Seed database verification
        run: |
          python seed.py

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

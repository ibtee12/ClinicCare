{% extends "base.html" %}

{% block title %}Patient Profile - ClinicCare{% endblock %}

{% block content %}
<div style="max-width: 650px; margin: 1rem auto; background: white; padding: 2.5rem; border-radius: 12px; border: 1px solid var(--border);">
  <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem; color: var(--text);">Patient Profile</h1>
  <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem;">Manage your medical contact details and demographic eligibility.</p>

  <form method="POST" action="{{ url_for('patient.profile') }}">
    <div style="margin-bottom: 1.25rem;">
      <label for="name" style="display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem;">Full Name</label>
      <input type="text" id="name" name="name" value="{{ user.name }}" required
        style="width: 100%; padding: 0.75rem; border: 1.5px solid var(--border); border-radius: 6px; font-size: 0.95rem;">
    </div>

    <div style="margin-bottom: 1.25rem;">
      <label for="email" style="display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem;">Email Address (Read-only)</label>
      <input type="email" id="email" value="{{ user.email }}" readonly disabled
        style="width: 100%; padding: 0.75rem; border: 1.5px solid var(--border); border-radius: 6px; font-size: 0.95rem; background: #f1f5f9;">
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;">
      <div>
        <label for="phone" style="display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem;">Mobile Number</label>
        <input type="text" id="phone" name="phone" value="{{ profile.phone or '' }}" required placeholder="017XXXXXXXX"
          style="width: 100%; padding: 0.75rem; border: 1.5px solid var(--border); border-radius: 6px; font-size: 0.95rem;">
      </div>
      <div>
        <label for="age" style="display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem;">Age</label>
        <input type="number" id="age" name="age" value="{{ profile.age or 25 }}" min="1" max="120"
          style="width: 100%; padding: 0.75rem; border: 1.5px solid var(--border); border-radius: 6px; font-size: 0.95rem;">
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem;">
      <div>
        <label for="gender" style="display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem;">Gender</label>
        <select id="gender" name="gender" style="width: 100%; padding: 0.75rem; border: 1.5px solid var(--border); border-radius: 6px; font-size: 0.95rem;">
          <option value="Male" {% if profile.gender == 'Male' %}selected{% endif %}>Male</option>
          <option value="Female" {% if profile.gender == 'Female' %}selected{% endif %}>Female</option>
          <option value="Other" {% if profile.gender == 'Other' %}selected{% endif %}>Other</option>
        </select>
      </div>
      <div>
        <label for="blood_group" style="display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem;">Blood Group</label>
        <select id="blood_group" name="blood_group" style="width: 100%; padding: 0.75rem; border: 1.5px solid var(--border); border-radius: 6px; font-size: 0.95rem;">
          <option value="">Select Blood Group</option>
          {% for bg in ['A+', 'A-', 'B+', 'B-', 'O+', 'O-', 'AB+', 'AB-'] %}
            <option value="{{ bg }}" {% if profile.blood_group == bg %}selected{% endif %}>{{ bg }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div style="margin-bottom: 1.25rem;">
      <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.95rem; font-weight: 600;">
        <input type="checkbox" name="is_student" value="1" {% if profile.is_student %}checked{% endif %} style="width: 18px; height: 18px;">
        Student Status (Eligible for 15% Student Discount)
      </label>
    </div>

    <div style="margin-bottom: 1.25rem;">
      <label for="address" style="display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem;">Residential Address</label>
      <input type="text" id="address" name="address" value="{{ profile.address or '' }}" placeholder="City, District"
        style="width: 100%; padding: 0.75rem; border: 1.5px solid var(--border); border-radius: 6px; font-size: 0.95rem;">
    </div>

    <div style="margin-bottom: 1.75rem;">
      <label for="medical_history" style="display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem;">Medical History &amp; Known Allergies</label>
      <textarea id="medical_history" name="medical_history" rows="3" placeholder="e.g. Hypertension, Asthma, Penicillin allergy"
        style="width: 100%; padding: 0.75rem; border: 1.5px solid var(--border); border-radius: 6px; font-size: 0.95rem;">{{ profile.medical_history or '' }}</textarea>
    </div>

    <button type="submit" class="btn" style="padding: 0.75rem 1.5rem; font-size: 1rem;">Save Profile Changes</button>
  </form>
</div>
{% endblock %}

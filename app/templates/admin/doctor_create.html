{% extends "base.html" %}

{% block title %}Register Doctor - ClinicCare{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm border-0 rounded-3 p-4">
            <h3 class="fw-bold mb-3">Register Clinical Specialist</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Doctor Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Dr. John Doe" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="john.doe@cliniccare.test" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Temporary Password</label>
                    <input type="password" name="password" class="form-control" required minlength="8">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Department</label>
                    <select name="department_id" class="form-select" required>
                        <option value="">Select Department</option>
                        {% for dept in departments %}
                        <option value="{{ dept.id }}">{{ dept.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Qualifications</label>
                    <input type="text" name="qualifications" class="form-control" placeholder="MBBS, FCPS" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Consultation Fee ($)</label>
                    <input type="number" step="0.01" name="fee" class="form-control" value="500.00" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Professional Biography</label>
                    <textarea name="bio" class="form-control" rows="3" placeholder="Specialist with over 10 years experience..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Create Doctor Profile</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
